<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 16–24 px. The subject is drawn nearly frame-filling: at this size the
       padding a tile normally has costs about a third of the usable area and
       the face turns to mush. The tile is still there so the family looks
       the same at every size — the horns simply overhang it. -->
  <rect width="256" height="256" rx="46" fill="#131312"/>

  <!-- horns -->
  <path d="M92 96 L 8 20 L 26 96 Z" fill="#e03028"/>
  <path d="M164 96 L 248 20 L 230 96 Z" fill="#6a6a60"/>
  <circle cx="14" cy="22" r="22" fill="#f5bb35"/>
  <circle cx="242" cy="22" r="22" fill="#f5bb35"/>

  <!-- hood brow -->
  <path d="M128 60 L 214 116 L 128 116 Z" fill="#6a6a60"/>
  <path d="M128 60 L 42 116 L 128 116 Z" fill="#e03028"/>

  <!-- skull, filling the frame -->
  <path d="M128 72
           C 182 72, 214 108, 214 150
           L 200 186 L 184 200 L 176 230 L 128 250 L 80 230 L 72 200 L 56 186 L 42 150
           C 42 108, 74 72, 128 72 Z"
        fill="#faf7ec"/>

  <!-- eyes -->
  <path d="M54 140 L 116 162 L 104 202 L 58 182 Z" fill="#000"/>
  <path d="M202 140 L 140 162 L 152 202 L 198 182 Z" fill="#000"/>
  <path d="M54 140 L 116 162" stroke="#ff3b28" stroke-width="14" stroke-linecap="round"/>
  <path d="M202 140 L 140 162" stroke="#ff3b28" stroke-width="14" stroke-linecap="round"/>

  <!-- grin -->
  <path d="M78 222 L 178 222 L 166 240 L 128 252 L 90 240 Z" fill="#000"/>
  <path d="M128 190 L 144 220 L 112 220 Z" fill="#000"/>
</svg>
