<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2c2c28"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
  </defs>

  <!-- Simplified drawing for 16–32 px. Everything is deliberately coarse:
       a feature thinner than ~16 units disappears at 16 px, so the horns are
       wedges, the bells are single dots, and the face is four shapes. -->
  <rect width="256" height="256" rx="46" fill="url(#bg2)"/>

  <!-- horns: short, thick wedges — they must survive as a silhouette -->
  <path d="M104 108 L 26 34 L 44 104 Z" fill="#d32b26"/>
  <path d="M152 108 L 230 34 L 212 104 Z" fill="#57574f"/>
  <circle cx="26" cy="34" r="20" fill="#f0b93f"/>
  <circle cx="230" cy="34" r="20" fill="#f0b93f"/>

  <!-- hood brow, split -->
  <path d="M128 84 L 200 128 L 128 128 Z" fill="#57574f"/>
  <path d="M128 84 L 56 128 L 128 128 Z" fill="#d32b26"/>

  <!-- skull: big, simple, fills the tile -->
  <path d="M128 92
           C 174 92, 202 122, 202 158
           L 190 186 L 176 198 L 170 222 L 128 236 L 86 222 L 80 198 L 66 186 L 54 158
           C 54 122, 82 92, 128 92 Z"
        fill="#f4f0e4"/>

  <!-- eyes: large angular wedges, the whole expression -->
  <path d="M66 148 L 118 166 L 108 200 L 70 184 Z" fill="#0a0a09"/>
  <path d="M190 148 L 138 166 L 148 200 L 186 184 Z" fill="#0a0a09"/>
  <path d="M66 148 L 118 166" stroke="#ff4a38" stroke-width="9" stroke-linecap="round"/>
  <path d="M190 148 L 138 166" stroke="#ff4a38" stroke-width="9" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M128 186 L 142 214 L 114 214 Z" fill="#0a0a09"/>

  <!-- grin: one bold dark band with two gaps cut out of it -->
  <path d="M86 220 L 170 220 L 160 232 L 128 240 L 96 232 Z" fill="#0a0a09"/>
  <g stroke="#f4f0e4" stroke-width="8">
    <path d="M110 220 L 111 236"/>
    <path d="M146 220 L 145 236"/>
  </g>
</svg>
