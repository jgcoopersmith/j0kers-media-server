<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2a2a27"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="bone" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbf8ee"/>
      <stop offset="0.55" stop-color="#ddd6c4"/>
      <stop offset="1" stop-color="#a79f8c"/>
    </linearGradient>
    <linearGradient id="redHood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2543c"/>
      <stop offset="0.5" stop-color="#c62828"/>
      <stop offset="1" stop-color="#6d0f10"/>
    </linearGradient>
    <linearGradient id="darkHood" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6e68"/>
      <stop offset="0.5" stop-color="#3a3a36"/>
      <stop offset="1" stop-color="#181816"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4032" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff4032" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="54" fill="url(#bg)"/>

  <!-- Horns as solid wedges rather than thin crescents: a crescent survives
       at 256 px and turns into a smudge by 32, so the whole family uses the
       same chunky shape and only the shading changes with size. The dark one
       carries a red rim so it still reads against a dark taskbar. -->
  <path d="M108 112 C 78 94, 46 62, 22 26 C 28 64, 34 92, 48 108 Z" fill="url(#redHood)"/>
  <path d="M148 112 C 178 94, 210 62, 234 26 C 228 64, 222 92, 208 108 Z" fill="url(#darkHood)"/>
  <path d="M148 112 C 178 94, 210 62, 234 26" fill="none" stroke="#9d2320" stroke-width="5" stroke-linecap="round"/>
  <circle cx="22" cy="24" r="15" fill="#f0b93f"/><circle cx="22" cy="24" r="6" fill="#7a5310"/>
  <circle cx="234" cy="24" r="15" fill="#f0b93f"/><circle cx="234" cy="24" r="6" fill="#7a5310"/>

  <!-- brow band of the hood, split down the centre -->
  <path d="M128 74 C 172 74, 196 98, 198 124 L 128 124 Z" fill="url(#darkHood)"/>
  <path d="M128 74 C 84 74, 60 98, 58 124 L 128 124 Z" fill="url(#redHood)"/>
  <path d="M128 74 L 128 124" stroke="#0d0d0c" stroke-width="3"/>
  <circle cx="128" cy="80" r="10" fill="#f0b93f"/><circle cx="128" cy="80" r="4" fill="#7a5310"/>

  <!-- skull: angular temples, hard cheekbones, narrow jaw -->
  <path d="M128 96
           C 166 96, 192 120, 192 152
           L 186 176 L 168 190
           L 162 212 L 150 226 L 128 232 L 106 226 L 94 212 L 88 190
           L 70 176 L 64 152
           C 64 120, 90 96, 128 96 Z"
        fill="url(#bone)"/>

  <!-- eye sockets: deep, angled hard toward the nose -->
  <ellipse cx="98" cy="168" rx="26" ry="20" fill="url(#glow)" opacity="0.55"/>
  <ellipse cx="158" cy="168" rx="26" ry="20" fill="url(#glow)" opacity="0.55"/>
  <path d="M74 146 L 120 162 L 112 190 L 78 178 Z" fill="#070706"/>
  <path d="M182 146 L 136 162 L 144 190 L 178 178 Z" fill="#070706"/>
  <path d="M74 146 L 120 162" stroke="#ff4a38" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M182 146 L 136 162" stroke="#ff4a38" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- nose cavity -->
  <path d="M128 178 L 141 204 L 115 204 Z" fill="#070706"/>

  <!-- grin: full width, hard teeth with gaps -->
  <path d="M92 212 L 164 212 L 158 224 L 128 232 L 98 224 Z" fill="#070706"/>
  <g stroke="#e8e1d0" stroke-width="4">
    <path d="M106 212 L 108 226"/>
    <path d="M120 212 L 121 230"/>
    <path d="M136 212 L 135 230"/>
    <path d="M150 212 L 148 226"/>
  </g>
</svg>
