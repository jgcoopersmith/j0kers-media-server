<!doctype html><meta charset=utf-8><title>seltest</title>
<style>#log{height:120px;overflow:auto;border:1px solid #999;user-select:text}</style>
<div id="before">HEADING BEFORE THE LOG</div>
<div id="log"><div id="l1">line one alpha</div><div id="l2">line two beta</div><div id="l3">line three gamma</div></div>
<div id="after">TEXT AFTER THE LOG</div>
<button id="btn">Copy</button>
<pre id="out"></pre>
<script>
const out=[];
function log(s){out.push(s);document.getElementById("out").textContent=out.join("\n");}
document.addEventListener("selectionchange",()=>{
  const s=getSelection();
  log("selectionchange collapsed="+s.isCollapsed+" rc="+s.rangeCount+" text="+JSON.stringify(s.toString().slice(0,30)));
});
document.getElementById("btn").addEventListener("click",()=>{
  const s=getSelection();
  log("CLICK handler: collapsed="+s.isCollapsed+" rc="+s.rangeCount+" text="+JSON.stringify(s.toString().slice(0,30)));
});
window.probe=function(kind){
  const box=document.getElementById("log");
  const s=getSelection(); s.removeAllRanges();
  const r=document.createRange();
  if(kind==="inside"){r.setStart(document.getElementById("l1").firstChild,0);r.setEnd(document.getElementById("l3").firstChild,5);}
  if(kind==="spillafter"){r.setStart(document.getElementById("l2").firstChild,0);r.setEnd(document.getElementById("after").firstChild,5);}
  if(kind==="spillbefore"){r.setStart(document.getElementById("before").firstChild,0);r.setEnd(document.getElementById("l2").firstChild,5);}
  s.addRange(r);
  return {kind, cac: r.commonAncestorContainer.nodeName+"#"+(r.commonAncestorContainer.id||r.commonAncestorContainer.parentNode.id||""),
          contains: box.contains(r.commonAncestorContainer), intersects: r.intersectsNode(box),
          text: s.toString().slice(0,40)};
};
</script>
